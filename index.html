<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0d1a">
    <title>Moonlit Doorwood</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="experience">
      <section class="welcome" id="welcome" aria-labelledby="title">
        <div class="welcome__content">
          <p class="eyebrow">A seasonal preview</p>
          <h1 id="title">Moonlit <span>Doorwood</span></h1>
          <p class="welcome__description">
            Follow the crooked path from the moonlit hill to a quiet forest
            where one evergreen door waits.
          </p>
          <button class="enter-button" id="enter-button" type="button">
            Enter the woods
          </button>
          <p class="welcome__note">A little curiosity goes a long way.</p>
          <p class="motion-note" id="motion-note" role="status" aria-live="polite" hidden>
            Reduced motion is on. The scene effects will stay still.
          </p>
        </div>
      </section>

      <audio
        id="ambience-audio"
        src="assets/audio/forest-winter-night.mp3"
        preload="none"
        loop
      ></audio>

      <section
        class="scene"
        id="scene"
        aria-label="Moonlit hill, crooked town, and the Christmas-tree door in the woods"
        hidden
      >
        <!-- Layers come from assets/layers/gothic_assets/gothic_parallax/manifest.json,
             drawn back to front at their trimmed offsets. Positions are in 941x1672 art
             pixels; interaction points live in hotspots.json in the same coordinates. -->
        <div
          class="stage"
          id="stage"
          role="img"
          aria-label="A stop-motion style night scene: a huge moon behind a curling spiral hill, a crooked town with glowing windows and a clock tower, and a great twisted tree with a green Christmas-tree door at the end of a stone path."
        >
          <img class="layer layer--sky-stars" src="assets/layers/gothic_assets/gothic_parallax/trimmed/01_sky_stars.png" style="left: 0px; top: 0px; width: 941px; height: 1672px" alt="" decoding="async">
          <img class="layer layer--moon" src="assets/layers/gothic_assets/gothic_parallax/trimmed/02_moon.png" style="left: 110px; top: 47px; width: 335px; height: 335px" alt="" decoding="async">
          <img class="layer layer--spiral-hill-body-trees-fence" src="assets/layers/gothic_assets/gothic_parallax/trimmed/03_spiral_hill_body_trees_fence.png" style="left: 0px; top: 156px; width: 941px; height: 418px" alt="" decoding="async">
          <img class="layer layer--spiral-tip" src="assets/layers/gothic_assets/gothic_parallax/trimmed/04_spiral_tip.png" style="left: 534px; top: 152px; width: 179px; height: 173px" alt="" decoding="async">
          <img class="layer layer--town-back-buildings" src="assets/layers/gothic_assets/gothic_parallax/trimmed/05_town_back_buildings.png" style="left: 0px; top: 303px; width: 941px; height: 366px" alt="" decoding="async">
          <img class="layer layer--clock-tower-body" src="assets/layers/gothic_assets/gothic_parallax/trimmed/06_clock_tower_body.png" style="left: 500px; top: 316px; width: 108px; height: 289px" alt="" decoding="async">
          <img class="layer layer--clock-face-hands" src="assets/layers/gothic_assets/gothic_parallax/trimmed/07_clock_face_hands.png" style="left: 541px; top: 432px; width: 32px; height: 36px" alt="" decoding="async">
          <img class="layer layer--town-left-front-buildings" src="assets/layers/gothic_assets/gothic_parallax/trimmed/08_town_left_front_buildings.png" style="left: 36px; top: 342px; width: 363px; height: 325px" alt="" decoding="async">
          <img class="layer layer--biggest-house-purple-roof" src="assets/layers/gothic_assets/gothic_parallax/trimmed/09_biggest_house_purple_roof.png" style="left: 626px; top: 429px; width: 312px; height: 284px" alt="" decoding="async">
          <img class="layer layer--biggest-house-open-shutters" src="assets/layers/gothic_assets/gothic_parallax/trimmed/10_biggest_house_open_shutters.png" style="left: 708px; top: 573px; width: 106px; height: 86px" alt="" decoding="async">
          <img class="layer layer--town-wall-fences-stairs-path-jackolanterns" src="assets/layers/gothic_assets/gothic_parallax/trimmed/11_town_wall_fences_stairs_path_jackolanterns.png" style="left: 0px; top: 494px; width: 941px; height: 314px" alt="" decoding="async">
          <img class="layer layer--dark-background-forest" src="assets/layers/gothic_assets/gothic_parallax/trimmed/12_dark_background_forest.png" style="left: 0px; top: 575px; width: 941px; height: 1097px" alt="" decoding="async">
          <img class="layer layer--big-door-tree-trunk-arched-frame" src="assets/layers/gothic_assets/gothic_parallax/trimmed/13_big_door_tree_trunk_arched_frame.png" style="left: 19px; top: 682px; width: 887px; height: 640px" alt="" decoding="async">
          <img class="layer layer--door-interior-snowy-christmas" src="assets/layers/gothic_assets/gothic_parallax/trimmed/14_door_interior_snowy_christmas.png" style="left: 401px; top: 927px; width: 203px; height: 318px" alt="" decoding="async">
          <img class="layer layer--green-christmas-door-panel" src="assets/layers/gothic_assets/gothic_parallax/trimmed/15_green_christmas_door_panel.png" style="left: 399px; top: 924px; width: 207px; height: 323px" alt="" decoding="async">
          <img class="layer layer--front-steps-two-lanterns" src="assets/layers/gothic_assets/gothic_parallax/trimmed/16_front_steps_two_lanterns.png" style="left: 343px; top: 1174px; width: 334px; height: 169px" alt="" decoding="async">
          <img class="layer layer--left-bushes-pumpkin" src="assets/layers/gothic_assets/gothic_parallax/trimmed/17_left_bushes_pumpkin.png" style="left: 0px; top: 1125px; width: 433px; height: 488px" alt="" decoding="async">
          <img class="layer layer--right-bushes-pumpkin" src="assets/layers/gothic_assets/gothic_parallax/trimmed/18_right_bushes_pumpkin.png" style="left: 510px; top: 1187px; width: 431px; height: 434px" alt="" decoding="async">
          <img class="layer layer--stone-path" src="assets/layers/gothic_assets/gothic_parallax/trimmed/19_stone_path.png" style="left: 147px; top: 1311px; width: 787px; height: 361px" alt="" decoding="async">
          <img class="layer layer--left-foreground-trunk" src="assets/layers/gothic_assets/gothic_parallax/trimmed/20_left_foreground_trunk.png" style="left: 0px; top: 0px; width: 355px; height: 1672px" alt="" decoding="async">
          <img class="layer layer--left-foreground-upper-branches" src="assets/layers/gothic_assets/gothic_parallax/trimmed/21_left_foreground_upper_branches.png" style="left: 0px; top: 0px; width: 475px; height: 338px" alt="" decoding="async">
          <img class="layer layer--right-foreground-trunk" src="assets/layers/gothic_assets/gothic_parallax/trimmed/22_right_foreground_trunk.png" style="left: 651px; top: 0px; width: 290px; height: 1672px" alt="" decoding="async">
          <img class="layer layer--right-foreground-upper-branches" src="assets/layers/gothic_assets/gothic_parallax/trimmed/23_right_foreground_upper_branches.png" style="left: 499px; top: 0px; width: 442px; height: 207px" alt="" decoding="async">
          <img class="layer layer--foreground-bottom-leaves" src="assets/layers/gothic_assets/gothic_parallax/trimmed/24_foreground_bottom_leaves.png" style="left: 0px; top: 1404px; width: 941px; height: 268px" alt="" decoding="async">
        </div>
        <div class="scene-controls">
          <button
            class="pause-control"
            id="pause-control"
            type="button"
            aria-label="Pause scene motion and ambience"
          >
            Pause
          </button>
        </div>
        <p class="experience-status" id="experience-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
